name: Windows-Installer bauen

# Baut bei jedem Push auf main (und bei Tags v*) den Installer
# Tolino-Uebersetzer-Setup-<Version>.exe auf einem windows-latest-Runner:
#   - Push auf main  -> Artefakt + aktualisierter DRAFT-Release "latest-build"
#   - Tag v*.*       -> veröffentlichter Release mit dem Installer
# Manuell startbar über "Run workflow".

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # für Releases (gh release)

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v6

      - name: Versionsnummer ermitteln (Tag v* -> Tag; sonst oberster CHANGELOG-Abschnitt "## vX.Y.Z")
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF.StartsWith("refs/tags/v")) {
            $v = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $line = Get-Content CHANGELOG.md | Where-Object { $_ -match '^## v\d+\.\d+\.\d+' } | Select-Object -First 1
            $v = "$line" -replace '^## v([\d.]+).*$', '$1'
          }
          if (-not $v) { Write-Error "Version konnte nicht ermittelt werden"; exit 1 }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$v"
          Add-Content -Path $env:GITHUB_ENV -Value "SETUP_FILE=Tolino-Uebersetzer-Setup-$v.exe"
          Write-Host "Version $v -> Installer-Datei: Tolino-Uebersetzer-Setup-$v.exe"

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: CUDA-Build von llama-cpp-python (best effort, sonst CPU-Wheel)
        continue-on-error: true
        run: |
          pip install --force-reinstall --no-deps llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cu124
          if ($LASTEXITCODE -ne 0) { pip install llama-cpp-python }

      - name: Tests laufen lassen
        run: python -m pytest -q

      - name: PyInstaller – eine EXE (packaging\dist\Gideons-Uebersetzer.exe)
        run: pyinstaller packaging/gideons_uebersetzer.spec --clean --noconfirm --distpath packaging/dist --workpath build/pyinstaller

      - name: Smoke-Test – EXE startet ohne Importfehler (--version, Exitcode 0)
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "packaging\dist\Gideons-Uebersetzer.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--version" -Wait -PassThru
          Write-Host "Exitcode der EXE: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Write-Error "EXE startet nicht sauber (Exitcode $($p.ExitCode)) – wahrscheinlich Importfehler im Bundle"; exit 1 }
          Write-Host "Smoke-Test ok: EXE startet und beendet sich mit Exitcode 0"

      - name: Inno Setup 6 installieren
        run: choco install innosetup -y

      - name: Installer kompilieren (packaging\dist\Tolino-Uebersetzer-Setup-<Version>.exe)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$($steps.version.outputs.version)" "packaging\installer.iss"
          if (!(Test-Path "packaging\dist\$env:SETUP_FILE")) { Write-Error "Installer nicht gefunden: $env:SETUP_FILE"; exit 1 }

      - name: Artefakt bereitstellen (Download unter dem Job)
        uses: actions/upload-artifact@v6
        with:
          name: Tolino-Uebersetzer-Setup
          path: packaging/dist/${{ env.SETUP_FILE }}
          retention-days: 30

      - name: Release Notes aus CHANGELOG.md extrahieren (bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        run: python packaging/extract_release_notes.py ${{ github.ref_name }} CHANGELOG.md release-notes.txt

      - name: Release veröffentlichen (bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create ${{ github.ref_name }} "packaging/dist/${{ env.SETUP_FILE }}" --title "Gideon's Übersetzer ${{ github.ref_name }}" --notes-file release-notes.txt

      - name: Draft-Release aktualisieren (bei Push auf main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $setup = "packaging/dist/$env:SETUP_FILE"
          $notes = "Automatisch gebaut bei Push auf main. Installer ohne Modell; das Modell (ca. 4-5 GB) lädt die App beim ersten Start selbst. Nur für Tests – nicht das offizielle Release."
          if (gh release view latest-build 2>$null) {
            gh release upload latest-build $setup --clobber
            gh release edit latest-build --notes $notes
          } else {
            gh release create latest-build $setup --draft --title "Entwicklungs-Build (automatisch)" --notes $notes
          }

  # Release nach jeder Änderung: Wenn CHANGELOG.md oben einen Abschnitt "## vX.Y.Z"
  # enthält, für den es noch keinen Release gibt, wird hier (nach grünem Build) der
  # Tag gesetzt und der Release direkt veröffentlicht – mit dem Installer aus dem
  # Artefakt des Build-Jobs und den Release Notes aus genau diesem CHANGELOG-Abschnitt.
  # (Hinweis: Ein Tag-Push mit GITHUB_TOKEN startet keine neuen Workflows – deshalb
  # wird der Release hier direkt per gh CLI erstellt, nicht über den Tag-Trigger.)
  auto-release:
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repo inkl. Tags auschecken
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Installer-Artefakt aus dem Build-Job laden
        uses: actions/download-artifact@v6
        with:
          name: Tolino-Uebersetzer-Setup
          path: artifact

      - name: Version aus CHANGELOG bestimmen, taggen und Release veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          version=$(grep -m1 -oE '^## v[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | head -1 | sed 's/^## //')
          if [ -z "$version" ]; then
            echo "Kein CHANGELOG-Abschnitt gefunden – kein Release."
            exit 0
          fi
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version existiert bereits – nichts zu tun."
            exit 0
          fi
          setup=$(find artifact -name "Tolino-Uebersetzer-Setup-*.exe" | head -1)
          if [ -z "$setup" ]; then
            echo "::error::Installer-Artefakt nicht gefunden"
            exit 1
          fi
          python3 packaging/extract_release_notes.py "$version" CHANGELOG.md release-notes.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git ls-remote --tags origin "$version" | grep -q "$version"; then
            git tag -a "$version" -m "Release $version (automatisch aus CHANGELOG.md)"
            git push origin "$version"
          fi
          gh release create "$version" "$setup" --title "Gideon's Übersetzer $version" --notes-file release-notes.txt
          echo "Release $version veröffentlicht."
